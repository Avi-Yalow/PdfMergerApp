name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v3

      - name: Set tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USER }}/pdfmerger:latest -t ${{ secrets.DOCKER_USER }}/pdfmerger:${IMAGE_TAG} .

      - name: Run container test
        run: |
          docker run -d -p 3000:3000 --name test-container ${{ secrets.DOCKER_USER }}/pdfmerger:latest
      
          for i in {1..12}; do
            if curl -fsS http://localhost:3000; then
              echo "Container is healthy"
              docker stop test-container
              exit 0
            fi
            echo "Waiting for app to become ready... attempt $i"
            sleep 5
          done
      
          echo "Container failed health check"
          docker logs test-container || true
          docker stop test-container || true
          exit 1

      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Push images
        run: |
          docker push ${{ secrets.DOCKER_USER }}/pdfmerger:latest
          docker push ${{ secrets.DOCKER_USER }}/pdfmerger:${IMAGE_TAG}

      - name: Deploy to Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
